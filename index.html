<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TURSIOPS — Persistent Coding Memory Authentication</title>
  <meta name="description" content="Sign in or register for Tursiops. Connect your VS Code extension and sync persistent coding directives with Turso libSQL.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Dedicated clean auth portal layout */
    .auth-page-wrapper {
      min-height: calc(100vh - 140px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 10;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-elevated);
      position: relative;
    }
    .auth-brand-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .auth-brand-badge .brand-glyph {
      font-size: 28px;
    }
    .auth-brand-badge .brand-text {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .auth-tabs-nav {
      display: flex;
      background: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 24px;
      gap: 4px;
    }
    .auth-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
    }
    .auth-tab-btn.active {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .deep-link-notice {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .deep-link-label {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--accent-cyan);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .deep-link-val {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-primary);
      word-break: break-all;
    }
    .auth-alert {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }
    .auth-alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .auth-alert.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-code);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      background: var(--bg-canvas);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      outline: none;
      transition: all var(--transition-fast);
    }
    .form-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 2px var(--accent-cyan-glow);
    }
    .btn-submit-auth {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      font-size: 14px;
    }
    .db-status-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .db-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }
    .user-profile-card {
      display: none;
      background: var(--bg-canvas);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 20px;
      text-align: left;
    }
    .user-profile-card.active {
      display: block;
    }
  </style>
</head>
<body class="dark-theme">
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-center"></div>

  <!-- Top Global Navigation Bar -->
  <header class="site-header">
    <div class="header-container">
      <div class="brand-group">
        <a href="/" class="brand-logo">
          <span class="brand-glyph">🐬</span>
          <span class="brand-text">TURSIOPS</span>
        </a>
        <span class="version-badge">v1.2.0</span>
      </div>

      <div class="header-actions">
        <a href="https://github.com/Ashzchu/Tursiops-web" target="_blank" rel="noopener noreferrer" class="btn btn-github">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </header>

  <main class="auth-page-wrapper">
    <div class="auth-container">
      
      <!-- Brand Header -->
      <div class="auth-brand-badge">
        <span class="brand-glyph">🐬</span>
        <span class="brand-text">TURSIOPS</span>
      </div>

      <!-- Mode Toggle (Sign In / Sign Up) -->
      <div class="auth-tabs-nav" role="tablist">
        <button class="auth-tab-btn active" id="btnTabSignIn" type="button">Sign In</button>
        <button class="auth-tab-btn" id="btnTabSignUp" type="button">Sign Up</button>
      </div>

      <!-- Dynamic Deep Link Info (if redirect_uri param exists) -->
      <div class="deep-link-notice" id="deepLinkNotice" style="display: none;">
        <span class="deep-link-label">IDE Deep Link Target</span>
        <span class="deep-link-val" id="deepLinkVal">vscode://ashzchu.tursiops/auth</span>
      </div>

      <!-- Feedback Alert Box -->
      <div class="auth-alert" id="authAlert" role="alert"></div>

      <!-- Active User Profile Display (when logged in via web session) -->
      <div class="user-profile-card" id="userProfileCard">
        <div style="font-size: 13px; font-weight: 600; color: var(--accent-cyan); margin-bottom: 6px;">✓ Session Active (Turso DB)</div>
        <div style="font-size: 13px; color: var(--text-primary); margin-bottom: 4px;" id="profileEmail"></div>
        <div style="font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); word-break: break-all;" id="profileUserId"></div>
        <button type="button" class="btn btn-secondary btn-sm" id="btnSignOut" style="margin-top: 12px; width: 100%;">Sign Out</button>
      </div>

      <!-- Main Auth Form -->
      <form id="mainAuthForm" autocomplete="on">
        <div class="form-group">
          <label for="inputEmail">Email Address</label>
          <input type="email" id="inputEmail" class="form-input" placeholder="developer@domain.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="inputPassword" id="labelPassword">Password</label>
          <input type="password" id="inputPassword" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-submit-auth" id="btnSubmit">
          <span id="submitSpinner" style="display: none;">⏳ </span>
          <span id="submitText">Sign In to Tursiops</span>
        </button>
      </form>

      <!-- Turso Connection Status -->
      <div class="db-status-badge">
        <span class="db-pulse"></span>
        <span>Turso libSQL Cloud Connected</span>
      </div>
    </div>
  </main>

  <!-- Notification Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
