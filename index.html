<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TURSIOPS — Persistent Coding Memory</title>
  <meta name="description" content="Persistent coding memory across AI sessions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Auth Modal Popup Custom Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(4, 7, 11, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-lg);
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(56, 189, 248, 0.08);
      position: relative;
    }
    .modal-close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: color var(--transition-fast);
    }
    .modal-close-btn:hover {
      color: var(--text-primary);
    }
    .auth-tabs {
      display: flex;
      background: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 4px;
      margin: 18px 0;
      gap: 4px;
    }
    .auth-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
    }
    .auth-tab-btn.active {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
    }
    .auth-alert-box {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .auth-alert-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }
    .auth-alert-box.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-code);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      background: var(--bg-canvas);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .form-input:focus {
      border-color: var(--accent-cyan);
    }
    .deep-link-banner {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      margin-bottom: 16px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--accent-cyan);
      word-break: break-all;
    }
  </style>
</head>
<body class="dark-theme">
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-center"></div>

  <!-- Minimal Header with Logo & Sign In Button Trigger -->
  <header class="site-header">
    <div class="header-container">
      <div class="brand-group">
        <a href="/" class="brand-logo">
          <span class="brand-glyph">🐬</span>
          <span class="brand-text">TURSIOPS</span>
        </a>
        <span class="version-badge">v1.2.0</span>
      </div>

      <div class="header-actions">
        <!-- Auth Button in Header: Triggers the Modal Popup -->
        <button class="btn btn-primary btn-sm" id="headerAuthBtn">Sign In</button>
        <!-- User Pill if authenticated -->
        <span id="headerUserEmail" style="display: none; font-size: 13px; color: var(--text-secondary); font-family: var(--font-mono);"></span>
        <button class="btn btn-ghost btn-sm" id="headerSignOutBtn" style="display: none;">Sign Out</button>
      </div>
    </div>
  </header>

  <!-- Clean Blank Canvas (Only Background Glow Visible) -->
  <main style="min-height: calc(100vh - 62px);"></main>

  <!-- Auth Modal Popup -->
  <div class="modal-overlay" id="authModal" aria-hidden="true">
    <div class="modal-card">
      <button class="modal-close-btn" id="btnCloseModal" aria-label="Close dialog">&times;</button>
      
      <div style="text-align: center; margin-bottom: 6px;">
        <span style="font-size: 26px;">🐬</span>
        <h2 style="font-size: 19px; font-weight: 700; color: var(--text-primary); margin-top: 4px;" id="modalHeading">Sign In</h2>
        <p style="font-size: 13px; color: var(--text-secondary); margin-top: 2px;">Persistent coding memory authentication</p>
      </div>

      <!-- Mode Selector Tabs (Sign In / Sign Up) -->
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab-btn active" id="modalTabSignIn" type="button">Sign In</button>
        <button class="auth-tab-btn" id="modalTabSignUp" type="button">Sign Up</button>
      </div>

      <!-- Deep link notification banner if redirect_uri is in URL -->
      <div class="deep-link-banner" id="deepLinkBanner" style="display: none;">
        <span>VS Code Redirect: </span><span id="deepLinkTarget"></span>
      </div>

      <!-- Error / Success Alert -->
      <div class="auth-alert-box" id="authAlertBox"></div>

      <!-- Authentication Form -->
      <form id="popupAuthForm" autocomplete="on">
        <!-- Name Field (Only shown in Sign Up) -->
        <div class="form-group" id="groupName" style="display: none;">
          <label for="modalName">Developer Name</label>
          <input type="text" id="modalName" class="form-input" placeholder="Ashzchu" autocomplete="name">
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="modalEmail">Email Address</label>
          <input type="email" id="modalEmail" class="form-input" placeholder="developer@domain.com" required autocomplete="email">
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="modalPassword" id="labelModalPassword">Password</label>
          <input type="password" id="modalPassword" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <!-- Confirm Password Field (Only shown in Sign Up) -->
        <div class="form-group" id="groupConfirmPassword" style="display: none;">
          <label for="modalConfirmPassword">Confirm Password</label>
          <input type="password" id="modalConfirmPassword" class="form-input" placeholder="••••••••••••" autocomplete="new-password">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block" id="btnModalSubmit" style="margin-top: 14px;">
          <span id="modalSpinner" style="display: none;">⏳ </span>
          <span id="modalSubmitText">Sign In</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
